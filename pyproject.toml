[project]
name = "things-mcp"
version = "0.8.1"
description = "Things app Model Context Protocol (MCP) server"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
keywords = ["things", "mcp", "model-context-protocol", "task-management", "macos"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: MacOS X",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Scheduling",
]
dependencies = [
    "httpx>=0.28.1",
    "fastmcp>=3.0.0,<4",
    # Pinned to a fork carrying a required patch: upstream returns NULL for
    # project/area on to-dos filed under a heading, which makes
    # /api/ssnc/completed silently return []. See patches/README.md.
    # Pin a full SHA, never a branch.
    "things-py @ git+https://github.com/joshmci9198/things.py@ef5e505aa759e9388e6983571694304462494a97",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
]

[project.scripts]
things-mcp = "things_mcp.server:main"

[project.urls]
Homepage = "https://github.com/hald/things-mcp"
Repository = "https://github.com/hald/things-mcp"
Issues = "https://github.com/hald/things-mcp/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/things_mcp"]

# Required so the pinned git reference for things-py above is accepted.
[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
